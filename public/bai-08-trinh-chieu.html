<script>'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=t=>katex.renderToString(t,{throwOnError:false,trust:false,output:'htmlAndMathml'});
const V=t=>m(`\\overrightarrow{${t}}`);
const graph=(id,label)=>`<div class="scene"><svg id="${id}" viewBox="0 0 620 340" role="img" aria-label="${label}"></svg></div>`;
const step=t=>`<p class="reveal" aria-hidden="true" inert>${t}</p>`;
const ribbon=t=>`<div class="ribbon">${t}</div>`;
const formula=t=>`<div class="formula">${m(t)}</div>`;
const card=(icon,title,text)=>`<div class="card reveal" aria-hidden="true" inert><h3>${title}</h3><p>${text}</p></div>`;
const pick=(id,options)=>`<div class="responses" id="${id}">${options.map((t,i)=>`<button class="choice" data-choice="${id}" data-value="${i}"><span class="letter">${'ABCD'[i]}</span><span>${t}</span></button>`).join('')}</div><div class="feedback" id="${id}-feedback" role="status"></div>`;
const split=(id,label,right)=>`<div class="split">${graph(id,label)}<div class="lab">${right}</div></div>`;

const quizQuestions=[
  ['Cho 3 điểm A, B, C bất kì. Phép cộng nối tiếp cho kết quả là vectơ nào?',[V('CA'),V('AC'),V('BA'),V('CB')],1,'Quy tắc ba điểm: ngọn của vectơ thứ nhất ghép với gốc của vectơ thứ hai: AB + BC = AC.'],
  ['Trong hình bình hành ABCD, vectơ tổng AB + AD bằng vectơ nào sau đây?',[V('BD'),V('DB'),V('AC'),V('CA')],2,'Quy tắc hình bình hành: đường chéo chính xuất phát từ đỉnh chung A là AC: AB + AD = AC.'],
  ['Vectơ đối của vectơ a là vectơ có đặc điểm gì?',['Cùng hướng và cùng độ dài','Ngược hướng và cùng độ dài','Cùng hướng và khác độ dài','Vuông góc và cùng độ dài'],1,'Vectơ đối có cùng độ dài nhưng ngược hướng hoàn toàn: a + (-a) = 0.'],
  ['Vectơ đối của vectơ AB được kí hiệu và viết lại là:',[V('AB'),V('BA'),'-'+V('BA'),'0'],1,'Vectơ đối của AB là -AB = BA.'],
  ['Với ba điểm O, A, B bất kì, quy tắc hiệu (ngọn trừ gốc) cho đẳng thức:',[V('OB')+'-'+V('OA')+'='+V('AB'),V('OB')+'-'+V('OA')+'='+V('BA'),V('OA')+'-'+V('OB')+'='+V('AB'),V('OB')+'+'+V('OA')+'='+V('AB')],0,'Quy tắc hiệu với gốc chung O: OB - OA = AB (lấy ngọn của số bị trừ trừ ngọn của số trừ).'],
  ['Cho điểm I là trung điểm của đoạn thẳng AB. Khẳng định nào sau đây là SAI?',[V('IA')+'+'+V('IB')+'=\\vec0',V('IA')+'='+V('IB'),'|'+V('IA')+'|=|'+V('IB')+'|',V('MA')+'+'+V('MB')+'=2'+V('MI')],1,'IA và IB ngược hướng nhau nên IA = -IB ≠ IB.'],
  ['Cho tam giác ABC có trọng tâm G. Đẳng thức vectơ nào sau đây luôn đúng?',[V('GA')+'+'+V('GB')+'+'+V('GC')+'=\\vec0',V('GA')+'+'+V('GB')+'='+V('GC'),'|'+V('GA')+'|=|'+V('GB')+'|',V('MA')+'+'+V('MB')+'=3'+V('MG')],0,'Hệ thức trọng tâm cơ bản: GA + GB + GC = 0.'],
  ['Hình thoi ABCD cạnh a có góc BAD = 60°. Độ lớn của vectơ AB + AD bằng bao nhiêu?',['a',m('a\\sqrt2'),m('a\\sqrt3'),'2a'],2,'AB + AD = AC. Tam giác ABD đều cạnh a, đường chéo AC = 2·(a√3/2) = a√3.'],
  ['Hai lực F1 = 3 N và F2 = 2 N cùng tác dụng vào một chất điểm, hợp nhau góc 120°. Hợp lực có độ lớn bằng:',['5 N','1 N',m('\\sqrt7\\text{ N} \\approx 2{,}65\\text{ N}'),m('\\sqrt{13}\\text{ N}')],2,'Theo định lí côsin: F² = 3² + 2² + 2·3·2·cos(120°) = 9 + 4 - 6 = 7 ⇒ F = √7 N.'],

function sound(kind='click') {
  if (!audioEnabled) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    audioContext ||= new Audio();
    if(audioContext.state==='suspended') audioContext.resume().catch(()=>{});
    const now=audioContext.currentTime;
    (kind==='good'?[523,659,784]:kind==='bad'?[240]:[560]).forEach((f,i)=>{
      const o=audioContext.createOscillator(),g=audioContext.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audioContext.destination);
      g.gain.setValueAtTime(.045,now+i*.075);g.gain.exponentialRampToValueAtTime(.001,now+i*.075+.13);
      o.start(now+i*.075);o.stop(now+i*.075+.14);
    });
  } catch { /* Audio is optional */ }
}
function notify(message) {
  $('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('#toast').hidden=true,3500);
}
function syncReveal() {
  const slide=$(`#slide-${current+1}`),items=$$('.reveal',slide),count=reveals[current];
  items.forEach((el,i)=>{const shown=i<count;el.classList.toggle('shown',shown);el.inert=!shown;el.setAttribute('aria-hidden',String(!shown));});
  $('.reveal-tools',slide).hidden=!items.length;
  $('.count',slide).textContent=`${count} / ${items.length}`;
  $('.reveal-one',slide).disabled=count===items.length;
  $('.reveal-all',slide).disabled=count===items.length;
  $('#next-idea').textContent=count<items.length?'Hiện ý tiếp ↓':current===sections.length-1?'Về đầu bài ↺':'Trang tiếp →';
  $('#all-ideas').hidden=!items.length;$('#all-ideas').disabled=count===items.length;
  $('#reveal-counter').textContent=items.length?`Ý ${count}/${items.length}`:'';
}
function reveal(all=false) {
  const length=$$('.reveal',$(`#slide-${current+1}`)).length;
  if(reveals[current]>=length)return false;
  reveals[current]=all?length:reveals[current]+1;syncReveal();sound();return true;
}
function showSlide(index,focus=true) {
  if(index<0||index>=sections.length)return;
  current=index;
  $$('.slide').forEach((s,i)=>{s.hidden=i!==index;s.classList.toggle('active',i===index);});
  $('#stage').scrollTop=0;$('#counter').textContent=`${String(index+1).padStart(2,'0')} / ${sections.length}`;
  $('#progress').style.width=`${(index+1)/sections.length*100}%`;
  $('#prev').disabled=index===0;$('#next').disabled=index===sections.length-1;
  $$('[data-goto]').forEach((b,i)=>b.setAttribute('aria-current',i===index?'step':'false'));
  syncReveal();if(focus)$(`#title-${index+1}`).focus({preventScroll:true});
}
function nextIdea(){if(!reveal()){sound();showSlide(current===sections.length-1?0:current+1);}}
$('#prev').onclick=()=>{sound();showSlide(current-1);};$('#next').onclick=()=>{sound();showSlide(current+1);};$('#next-idea').onclick=nextIdea;

async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('Trình duyệt này chưa hỗ trợ toàn màn hình.');}catch{notify('Hãy mở slide ở tab riêng để dùng chế độ toàn màn hình.');}}
$('#fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{
  if($('#toc').open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(e.code==='Space'&&e.target.closest('button,a'))return;
  const key=e.key.toLowerCase();
  if(['arrowright','pagedown'].includes(key)){e.preventDefault();nextIdea();}
  else if(key===' '){e.preventDefault();nextIdea();}
  else if(['arrowleft','pageup'].includes(key)){e.preventDefault();showSlide(current-1);}
  else if(key==='arrowdown'){e.preventDefault();reveal();}
  else if(key==='arrowup'){e.preventDefault();reveals[current]=Math.max(0,reveals[current]-1);syncReveal();}
  else if(key==='home'){e.preventDefault();showSlide(0);}
  else if(key==='end'){e.preventDefault();showSlide(sections.length-1);}
  else if(key==='f'){e.preventDefault();fullscreen();}
  else if(key==='m'){e.preventDefault();$('#sound').click();}
});

let quizIndex=0;const quizAnswers=quizQuestions.map(()=>null);
function renderQuiz(){
  const score=quizAnswers.filter((a,i)=>a===quizQuestions[i][2]).length,done=quizAnswers.filter(a=>a!==null).length;
  if(quizIndex===quizQuestions.length){
    $('#quiz').innerHTML=`<div class="card quiz-end"><div class="score-big">${score} / ${quizQuestions.length}</div><h3>Kết quả Đấu trường Quiz Bài 8</h3><p>${score===quizQuestions.length?'Xuất sắc! Em đã nắm vững 100% bản chất phép cộng và trừ vectơ!':'Xem lại những câu chưa đúng rồi thử lại để đạt 12/12 nhé!'}</p><button class="action primary" id="quiz-reset">↺ Làm lại toàn bộ</button></div>`;
    $('#quiz-reset').onclick=resetQuiz;return;
  }
  const [q,options,correct,explain]=quizQuestions[quizIndex],picked=quizAnswers[quizIndex],answered=picked!==null;
  $('#quiz').innerHTML=`<div class="quiz-meta"><span>Câu ${quizIndex+1} / ${quizQuestions.length}</span><span>Đã làm ${done} · Đúng ${score}</span><button class="action" id="quiz-reset">↺ Làm lại</button></div><div class="card"><h3 class="quiz-question">${q}</h3><div class="quiz-options">${options.map((o,i)=>`<button class="choice ${answered?(i===correct?'correct':i===picked?'wrong':''):''}" data-quiz="${i}" ${answered?'disabled':''}><span class="letter">${answered&&i===correct?'✓':'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="feedback ${picked===correct?'good':''}">${answered?(picked===correct?'✓ Chính xác. ':'↪ Chưa đúng. ')+explain:''}</div><div class="quiz-actions"><button class="action" id="quiz-prev" ${quizIndex===0?'disabled':''}>← Câu trước</button><button class="action primary" id="quiz-next" ${answered?'':'disabled'}>${quizIndex===quizQuestions.length-1?'Xem tổng điểm':'Câu tiếp →'}</button></div></div>`;
  $('#quiz-reset').onclick=resetQuiz;
  $('#quiz-prev').onclick=()=>{quizIndex--;renderQuiz();};
  $('#quiz-next').onclick=()=>{quizIndex++;renderQuiz();if(quizIndex===quizQuestions.length){sound('good');if(score===quizQuestions.length)confetti();}};
  $$('[data-quiz]').forEach(b=>b.onclick=()=>{
    if(quizAnswers[quizIndex]!==null)return;
    quizAnswers[quizIndex]=Number(b.dataset.quiz);
    sound(quizAnswers[quizIndex]===correct?'good':'bad');
    renderQuiz();
    $('#quiz-next').focus({preventScroll:true});
  });
}
function resetQuiz(){quizAnswers.fill(null);quizIndex=0;renderQuiz();sound();}

let celebrationTimer;
function confetti(){
  if(!motion||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const layer=$('#confetti');clearTimeout(celebrationTimer);layer.replaceChildren();
  const colors=['#38bdf8','#fbbf24','#f43f5e','#10b981'];
  for(let i=0;i<65;i++){
    const p=document.createElement('i');
    p.style.left=`${Math.random()*100}%`;
    p.style.animationDelay=`${Math.random()*.45}s`;
    p.style.background=colors[i%4];
    layer.append(p);
  }
  celebrationTimer=setTimeout(()=>layer.replaceChildren(),2500);
}

// Interactive SVG diagrams and labs for Bài 8: Tổng và hiệu của hai vectơ
const sub=(a,b)=>[b[0]-a[0],b[1]-a[1]];
const close=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<1e-8;

function diagram(id,points,arrows=[],options={}){
  const svg=$('#'+id);if(!svg)return;
  let xs=Object.values(points).map(p=>p[0]),ys=Object.values(points).map(p=>p[1]);
  const xmin=options.grid?0:Math.min(...xs),xmax=options.grid?8:Math.max(...xs),ymin=options.grid?0:Math.min(...ys),ymax=options.grid?8:Math.max(...ys);
  const scale=Math.min(460/(xmax-xmin||1),240/(ymax-ymin||1));
  const ox=310-(xmin+xmax)*scale/2,oy=170+(ymin+ymax)*scale/2;
  const xy=p=>[ox+p[0]*scale,oy-p[1]*scale];
  const colors=['#38bdf8','#fbbf24','#f43f5e','#10b981','#818cf8'];

  let html=`<defs>${colors.map(c=>`<marker id="${id}-${c.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('')}</defs>`;

  if(options.polygon){
    const pts=options.polygon.map(k=>xy(points[k]).join(',')).join(' ');
    html+=`<polygon points="${pts}" fill="rgba(56, 189, 248, 0.05)" stroke="#334155" stroke-width="2"/>`;
  }

  // Draw aux dashed lines
  if(options.dashed){
    for(const [a,b] of options.dashed){
      const p=xy(points[a]),q=xy(points[b]);
      html+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>`;
    }
  }

  // Draw arrows
  for(const [i,item] of arrows.entries()){
    const [a,b,color=colors[i%colors.length],dash='']=item;
    if(!points[a]||!points[b])continue;
    const p=xy(points[a]),q=xy(points[b]);
    html+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="4" marker-end="url(#${id}-${color.slice(1)})" ${dash?'stroke-dasharray="6 4"':''}/>`;
  }

  // Draw points & labels
  for(const [name,p] of Object.entries(points)){
    const [x,y]=xy(p);
    html+=`<circle cx="${x}" cy="${y}" r="4.5" fill="#f8fafc"/>`;
    if(!options.hideLabels){
      html+=`<text x="${x+9}" y="${y-10}" font-weight="bold" font-size="18">${esc(name)}</text>`;
    }
  }

  if(options.label){
    html+=`<text x="310" y="325" text-anchor="middle" class="small" fill="#94a3b8">${esc(options.label)}</text>`;
  }
  svg.innerHTML=html;
}

function renderChain(mode){
  if(mode===0){
    diagram('chain-lab',{A:[0,0],B:[3,1],C:[6,4]},[['A','B','#38bdf8'],['B','C','#10b981'],['A','C','#fbbf24']],{label:'3 điểm: AB + BC = AC'});
    $('#chain-result').innerHTML='<strong>AB + BC = AC</strong><br><small>2 chặng nối tiếp.</small>';
  } else if(mode===1){
    diagram('chain-lab',{A:[0,0],B:[2,2],C:[5,3],D:[7,1]},[['A','B','#38bdf8'],['B','C','#10b981'],['C','D','#818cf8'],['A','D','#fbbf24']],{label:'4 điểm: AB + BC + CD = AD'});
    $('#chain-result').innerHTML='<strong>AB + BC + CD = AD</strong><br><small>3 chặng nối tiếp liên tục.</small>';
  } else {
    diagram('chain-lab',{A:[0,0],B:[3,3],C:[6,1]},[['A','B','#38bdf8'],['B','C','#10b981'],['C','A','#f43f5e']],{label:'Khép kín: AB + BC + CA = AA = 0'});
    $('#chain-result').innerHTML='<strong>AB + BC + CA = AA = \\(\\vec0\\)</strong><br><small>Đa giác khép kín có tổng bằng vectơ-không.</small>';
  }
}
$$('[data-chain]').forEach(b=>b.onclick=()=>renderChain(Number(b.dataset.chain)));

// 9. Parallelogram Lab (Interactive slider)
function updatePBHLab(){
  const deg=Number($('#pbh-angle').value);
  $('#pbh-angle-val').textContent=deg+'°';
  const rad=deg*Math.PI/180;
  const F1=10, F2=10;
  const Dx=F2*Math.cos(rad), Dy=F2*Math.sin(rad);
  const Cx=F1+Dx, Cy=Dy;
  const resF=Math.sqrt(F1*F1 + F2*F2 + 2*F1*F2*Math.cos(rad));

  diagram('parallelogram-lab',{A:[0,0],B:[F1,0],D:[Dx,Dy],C:[Cx,Cy]},[['A','B','#38bdf8'],['A','D','#10b981'],['A','C','#fbbf24']],{dashed:[['B','C'],['D','C']],label:`Góc θ = ${deg}° · Hợp lực F = ${resF.toFixed(2)} N`});
  $('#pbh-result').innerHTML=`<strong>Hợp lực |F| = ${resF.toFixed(2)} N</strong><br><small>${deg===0?'Cực đại F = 20 N (cùng hướng)':deg===180?'Cực tiểu F = 0 N (ngược hướng triệt tiêu)':`F = 2·10·cos(${deg/2}°) = ${(20*Math.cos(rad/2)).toFixed(2)} N`}</small>`;
}
if($('#pbh-angle')){
  $('#pbh-angle').oninput=updatePBHLab;
  updatePBHLab();
}

// 21. Incline Lab (Interactive slider)
function updateSlopeLab(){
  const deg=Number($('#slope-angle').value);
  $('#slope-angle-val').textContent=deg+'°';
  const rad=deg*Math.PI/180;
  const mass=2260; // kg
  const g=9.8;
  const P=mass*g;
  const Px=P*Math.sin(rad);
  const soldiers=Math.ceil(Px/100);

  const L=8;
  const H=L*Math.sin(rad);
  const W=L*Math.cos(rad);

  diagram('incline-lab',{O:[0,0],B:[W,0],T:[W,H],G:[W/2,H/2+0.5],Px:[W/2-1.5*Math.cos(rad),H/2+0.5-1.5*Math.sin(rad)],Fk:[W/2+2*Math.cos(rad),H/2+0.5+2*Math.sin(rad)]},[['G','Px','#fbbf24'],['G','Fk','#10b981']],{polygon:['O','B','T'],label:`Dốc ${deg}° · Lực tụt dốc Px = ${Px.toFixed(0)} N`});

  $('#slope-result').innerHTML=`<strong>Lực trượt: ${Px.toFixed(0)} N · Cần tối thiểu ${soldiers} chiến sĩ</strong><br><small>Góc càng dốc thì P·sin(α) càng lớn!</small>`;
}
if($('#slope-angle')){
  $('#slope-angle').oninput=updateSlopeLab;
  updateSlopeLab();
}

// Group activity timer
let timerId, timeRemaining = 180;
const timerEl = $('#group-time');
function updateTimer(){
  const m = Math.floor(timeRemaining / 60);
  const s = timeRemaining % 60;
  if(timerEl) timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
if($('#group-start')){
  $('#group-start').onclick=()=>{
    clearInterval(timerId);
    timerId=setInterval(()=>{
      if(timeRemaining>0){ timeRemaining--; updateTimer(); }
      else { clearInterval(timerId); sound('good'); notify('Hết 3 phút thảo luận nhóm!'); }
    },1000);
  };
  $('#group-pause').onclick=()=>clearInterval(timerId);
  $('#group-reset').onclick=()=>{ clearInterval(timerId); timeRemaining=180; updateTimer(); };
}

// Checkboxes checklist
$$('.check').forEach(b=>b.onclick=()=>{
  const val = b.getAttribute('aria-pressed')==='true';
  b.setAttribute('aria-pressed', String(!val));
  b.querySelector('.check-icon').textContent = !val ? '☑' : '□';
  sound();
});
